<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>講師填報</title>
<meta name="theme-color" content="#7a2e2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="講師填報">
<link rel="icon" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #faf6ef; font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  .fallback { position: fixed; left: 0; right: 0; bottom: 0; text-align: center; padding: 8px; font-size: 13px; color: #6f6560; }
  .fallback a { color: #7a2e2e; }
  .loading { position: fixed; inset: 0; display: grid; place-items: center; color: #7a2e2e; font-size: 18px; }
</style>
</head>
<body>
<div class="loading" id="loading">講師填報載入中…</div>
<iframe id="app" title="講師填報" allow="clipboard-write"></iframe>
<div class="fallback" id="fb" hidden>畫面沒有出現？<a id="direct" target="_top">按這裡直接開啟</a></div>
<script>
  // 班會資訊平台的網址（Apps Script 部署網址；重新建立部署時才需要修改）
  var APP_URL = 'https://script.google.com/macros/s/AKfycbxYrFijAN5d8CWq788TIpud7MAJ6gXRJZkalpwMWcfZpZzNd4f5zL4n7aAPCn4YoZgX/exec';
  var url = APP_URL + '?page=lecturer';
  var r = new URLSearchParams(location.search).get('r');   // 各區專用：?r=1～6
  if (r && /^[1-6]$/.test(r)) url += '&r=' + r;
  var f = document.getElementById('app');
  f.onload = function () { document.getElementById('loading').hidden = true; };
  f.src = url;
  document.getElementById('direct').href = url;
  setTimeout(function () { document.getElementById('fb').hidden = false; }, 8000);
  // LINE 內建瀏覽器有時無法顯示內嵌畫面，直接開啟
  if (/ Line\//i.test(navigator.userAgent)) location.replace(url);
</script>
</body>
</html>
